# The kit's pub workspace. It is not a package: the four packages and their examples live
# under packages/, and one `flutter pub get` here resolves them all.
name: voxel_game_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/sound_recipes
  - packages/voxel_engine
  - packages/voxel_game
  - packages/voxel_game/example
  - packages/voxel_scene
  - packages/voxel_scene/example
