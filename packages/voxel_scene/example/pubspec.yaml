name: voxel_scene_example
description: >-
  voxel_scene's example: sine hills streamed on isolates by voxel_engine and drawn
  with flutter_scene under a sun, from an orbiting camera.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.23.0
  vector_math: ^2.1.4
  voxel_engine: ^0.1.2-dev
  voxel_scene: ^0.1.2-dev

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
