name: voxel_game_example
description: >-
  voxel_game's example: a voxel sandbox declared in one file — blocks,
  a four-biome world with towers, a player, animals and night creatures.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  voxel_game: ^0.1.0-dev

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
