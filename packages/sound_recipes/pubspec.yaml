name: sound_recipes
description: >-
  Game sounds with no audio files: write a recipe, it is synthesised to WAV
  at start-up and played through flutter_soloud. A stock set by material, and
  music crossfaded by context.
version: 0.1.0-dev
homepage: https://github.com/fluttely/voxel_game
repository: https://github.com/fluttely/voxel_game/tree/main/packages/sound_recipes
issue_tracker: https://github.com/fluttely/voxel_game/issues
topics:
  - audio
  - sound-effects
  - synthesizer
  - procedural-audio
  - game-development

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^4.1.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
